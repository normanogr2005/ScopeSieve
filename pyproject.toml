[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopesieve"
version = "0.1.0"
description = "Offline scope auditing for authorized security assessment artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScopeSieve contributors" }]
dependencies = []

[project.scripts]
scopesieve = "scopesieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
